[project]
name = "designice"
version = "0.1.0"
description = "Vector-matched design library -> standalone Next.js websites. Claude skills + MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# The OpenAI and Voyage backends talk raw HTTP through urllib, so they need no
# SDK - just an API key. Only the local backend and the test suite add packages.
local = ["sentence-transformers>=3.0"]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
designice = "designice.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
designice = ["templates/**/*"]
